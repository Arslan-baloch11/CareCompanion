<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Change Password - CareCompanion</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #2563eb;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav-links a {
            text-decoration: none;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        /* =====================================================
           PAGE
        ===================================================== */

        .page-container {
            width: 100%;
            max-width: 620px;
            margin: 55px auto;
            padding: 0 20px;
        }

        .password-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
        }

        .icon-box {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 29px;
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 30px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 10px;
        }

        .page-description {
            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .form-group {
            margin-bottom: 21px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 8px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-input {
            width: 100%;
            height: 50px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 0 50px 0 15px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            background: #ffffff;
        }

        .password-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .show-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            color: #6b7280;
        }

        .show-password:hover {
            color: #2563eb;
        }

        /* =====================================================
           PASSWORD REQUIREMENTS
        ===================================================== */

        .requirements {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;
            margin: 5px 0 25px;
        }

        .requirements-title {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 9px;
        }

        .requirement {
            font-size: 13px;
            color: #6b7280;
            margin: 5px 0;
        }

        .requirement.valid {
            color: #16a34a;
            font-weight: 600;
        }

        /* =====================================================
           ALERTS
        ===================================================== */

        .alert {
            display: none;
            padding: 13px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .alert.success {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .alert.error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        /* =====================================================
           BUTTONS
        ===================================================== */

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            height: 50px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            border: none;
            background: #2563eb;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            border: 1px solid #d1d5db;
            background: #ffffff;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #f9fafb;
        }

        /* =====================================================
           FOOTER NOTE
        ===================================================== */

        .security-note {
            margin-top: 22px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.5;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a {
                font-size: 12px;
            }

            .page-container {
                margin: 30px auto;
            }

            .password-card {
                padding: 25px 20px;
            }

            .page-title {
                font-size: 25px;
            }

            .button-row {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

    </style>

</head>

<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        CareCompanion
    </a>


    <div class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="customer-edit-profile.html">
            Profile
        </a>

        <a
            href="#"
            onclick="logoutUser(); return false;"
        >
            Logout
        </a>

    </div>

</nav>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="page-container">

    <div class="password-card">


        <div class="icon-box">
            🔐
        </div>


        <h1 class="page-title">
            Change Password
        </h1>


        <p class="page-description">
            Update your CareCompanion account password.
            For your security, enter your current password
            before choosing a new one.
        </p>


        <!-- ALERTS -->

        <div
            id="successAlert"
            class="alert success"
        ></div>


        <div
            id="errorAlert"
            class="alert error"
        ></div>


        <!-- =================================================
             FORM
        ================================================= -->

        <form id="changePasswordForm">


            <!-- CURRENT PASSWORD -->

            <div class="form-group">

                <label for="currentPassword">
                    Current Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="currentPassword"
                        class="password-input"
                        placeholder="Enter current password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword(
                            'currentPassword',
                            this
                        )"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- NEW PASSWORD -->

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        class="password-input"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword(
                            'newPassword',
                            this
                        )"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- REQUIREMENTS -->

            <div class="requirements">

                <div class="requirements-title">
                    Password requirements
                </div>

                <div
                    id="lengthRequirement"
                    class="requirement"
                >
                    ○ At least 6 characters
                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        class="password-input"
                        placeholder="Re-enter new password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword(
                            'confirmPassword',
                            this
                        )"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="button-row">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="goBack()"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    id="changePasswordBtn"
                    class="btn btn-primary"
                >
                    Change Password
                </button>

            </div>


        </form>


        <div class="security-note">
            🔒 Your password is securely encrypted before
            being stored.
        </div>


    </div>

</main>


<script>

/* =====================================================
   API
===================================================== */

const API_BASE_URL =
    "http://localhost:5000/api";


/* =====================================================
   SESSION CHECK
===================================================== */

function getSession() {

    const possibleKeys = [
        "carecompanionSession",
        "userSession",
        "currentUser"
    ];

    for (const key of possibleKeys) {

        const value =
            localStorage.getItem(key);

        if (!value) {
            continue;
        }

        try {

            const parsed =
                JSON.parse(value);

            if (parsed) {
                return parsed;
            }

        }

        catch (error) {

            return {
                token: value
            };

        }

    }

    return null;
}


function getToken() {

    const session =
        getSession();

    if (!session) {
        return null;
    }

    return (
        session.token ||
        session.accessToken ||
        session.jwt ||
        null
    );
}


/* =====================================================
   LOGIN CHECK
===================================================== */

const token =
    getToken();

if (!token) {

    window.location.href =
        "login.html";

}


/* =====================================================
   ALERT FUNCTIONS
===================================================== */

function showSuccess(message) {

    const success =
        document.getElementById(
            "successAlert"
        );

    const error =
        document.getElementById(
            "errorAlert"
        );

    error.style.display =
        "none";

    success.textContent =
        message;

    success.style.display =
        "block";

}


function showError(message) {

    const success =
        document.getElementById(
            "successAlert"
        );

    const error =
        document.getElementById(
            "errorAlert"
        );

    success.style.display =
        "none";

    error.textContent =
        message;

    error.style.display =
        "block";

}


function hideAlerts() {

    document.getElementById(
        "successAlert"
    ).style.display = "none";

    document.getElementById(
        "errorAlert"
    ).style.display = "none";

}


/* =====================================================
   PASSWORD VISIBILITY
===================================================== */

function togglePassword(
    inputId,
    button
) {

    const input =
        document.getElementById(
            inputId
        );

    if (input.type === "password") {

        input.type =
            "text";

        button.textContent =
            "🙈";

    }

    else {

        input.type =
            "password";

        button.textContent =
            "👁";

    }

}


/* =====================================================
   PASSWORD REQUIREMENT
===================================================== */

const newPasswordInput =
    document.getElementById(
        "newPassword"
    );

const lengthRequirement =
    document.getElementById(
        "lengthRequirement"
    );


newPasswordInput.addEventListener(
    "input",
    function () {

        if (this.value.length >= 6) {

            lengthRequirement.textContent =
                "✓ At least 6 characters";

            lengthRequirement.classList.add(
                "valid"
            );

        }

        else {

            lengthRequirement.textContent =
                "○ At least 6 characters";

            lengthRequirement.classList.remove(
                "valid"
            );

        }

    }
);


/* =====================================================
   CHANGE PASSWORD
===================================================== */

document
    .getElementById(
        "changePasswordForm"
    )
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            hideAlerts();


            const currentPassword =
                document
                    .getElementById(
                        "currentPassword"
                    )
                    .value
                    .trim();


            const newPassword =
                document
                    .getElementById(
                        "newPassword"
                    )
                    .value;


            const confirmPassword =
                document
                    .getElementById(
                        "confirmPassword"
                    )
                    .value;


            /* =========================================
               VALIDATION
            ========================================= */

            if (!currentPassword) {

                showError(
                    "Please enter your current password."
                );

                return;

            }


            if (!newPassword) {

                showError(
                    "Please enter a new password."
                );

                return;

            }


            if (newPassword.length < 6) {

                showError(
                    "New password must be at least 6 characters."
                );

                return;

            }


            if (!confirmPassword) {

                showError(
                    "Please confirm your new password."
                );

                return;

            }


            if (
                newPassword !==
                confirmPassword
            ) {

                showError(
                    "New password and confirmation password do not match."
                );

                return;

            }


            if (
                currentPassword ===
                newPassword
            ) {

                showError(
                    "New password must be different from your current password."
                );

                return;

            }


            /* =========================================
               BUTTON LOADING
            ========================================= */

            const button =
                document.getElementById(
                    "changePasswordBtn"
                );

            button.disabled =
                true;

            button.textContent =
                "Changing Password...";


            try {

                /* =====================================
                   API REQUEST
                ===================================== */

                const response =
                    await fetch(
                        API_BASE_URL +
                        "/auth/change-password",
                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " +
                                    token

                            },

                            body:
                                JSON.stringify({

                                    currentPassword:
                                        currentPassword,

                                    newPassword:
                                        newPassword

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(

                        data.message ||
                        "Failed to change password."

                    );

                }


                /* =====================================
                   SUCCESS
                ===================================== */

                showSuccess(
                    "Password changed successfully."
                );


                document
                    .getElementById(
                        "changePasswordForm"
                    )
                    .reset();


                lengthRequirement.textContent =
                    "○ At least 6 characters";

                lengthRequirement.classList.remove(
                    "valid"
                );


                button.textContent =
                    "Password Changed";


                /* =====================================
                   RETURN TO DASHBOARD
                ===================================== */

                setTimeout(
                    function () {

                        window.location.href =
                            "dashboard.html";

                    },
                    1800
                );


            }

            catch (error) {

                console.error(
                    "Change Password Error:",
                    error
                );


                showError(
                    error.message ||
                    "Something went wrong. Please try again."
                );


                button.disabled =
                    false;

                button.textContent =
                    "Change Password";

            }

        }
    );


/* =====================================================
   CANCEL
===================================================== */

function goBack() {

    window.location.href =
        "dashboard.html";

}


/* =====================================================
   LOGOUT
===================================================== */

function logoutUser() {

    const keys = [
        "carecompanionSession",
        "userSession",
        "currentUser"
    ];

    keys.forEach(
        function (key) {

            localStorage.removeItem(
                key
            );

        }
    );


    window.location.href =
        "login.html";

}

</script>

</body>
</html>
